<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>WWM Monitor - see what your connection feels</title>
<link rel="icon" type="image/png" href="assets/logo.png" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="styles/site.css?v=5" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="components/RealMap.jsx"></script>
<script type="text/babel" src="components/AppMocks.jsx"></script>
<script type="text/babel" src="components/Site.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;


const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "animatedMetrics": true
}/*EDITMODE-END*/;

function App() {
  const [tweaksOn, setTweaksOn] = useState(false);
  const [animated, setAnimated] = useState(TWEAK_DEFAULTS.animatedMetrics);
  useEffect(() => {
    const onMsg = (e) => {
      if (e.data?.type === "__activate_edit_mode") setTweaksOn(true);
      if (e.data?.type === "__deactivate_edit_mode") setTweaksOn(false);
    };
    window.addEventListener("message", onMsg);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);
  const setAndPersist = (v) => {
    setAnimated(v);
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { animatedMetrics: v } }, "*");
  };
  return (
    <>
      <Site />
      {tweaksOn && (
        <div className="tweaks">
          <b>Tweaks</b>
          <div className="tw-row">
            <label>Animated metrics</label>
            <div className="tw-seg">
              <button className={animated?"is-active":""} onClick={()=>setAndPersist(true)}>ON</button>
              <button className={!animated?"is-active":""} onClick={()=>setAndPersist(false)}>OFF</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
